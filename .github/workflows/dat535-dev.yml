name: DAT535 — Dev Pipeline

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  run-dev:
    name: Run Dev Project Pipeline
    runs-on: self-hosted
    environment: dev
    env:
      DAT535_ENV: dev
      SPARK_HOME: /opt/spark
      JAVA_HOME: /usr/lib/jvm/java-8-openjdk-amd64

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Resolve output directory
        id: output-dir
        # Persistent, non-tmp path: survives runner reboots/tmpfiles cleanup, unlike /tmp
        run: echo "dir=$HOME/spark-lab-data/dev" >> "$GITHUB_OUTPUT"

      - name: Run Project Pipeline 
        env:
          DAT535_OUTPUT_DIR: ${{ steps.output-dir.outputs.dir }}
          DAT535_RAW_DIR: ${{ steps.output-dir.outputs.dir }}/project/raw
        run: |
          source ~/spark-env/bin/activate
          mkdir -p "$DAT535_OUTPUT_DIR" "$DAT535_RAW_DIR"
          
          echo "=== Running Bike-Sharing & Weather Dev Pipeline ==="
          python $GITHUB_WORKSPACE/run_pipeline.py project

      - name: Upload Dev manifest
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dev-manifest-${{ github.run_number }}
          path: ${{ steps.output-dir.outputs.dir }}/project/raw/_manifest/
          retention-days: 7
          if-no-files-found: ignore