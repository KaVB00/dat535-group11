name: DAT535 — Production Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      lab:
        description: Pipeline to run
        required: true
        default: project
        type: choice
        options: [project, Bronze]

jobs:
  deploy-prod:
    name: Run Bike-sharing & Weather Pipeline
    runs-on: self-hosted
    environment: main
    env:
      DAT535_ENV: prod
      DAT535_OUTPUT_DIR: /home/ubuntu/group11/Project/raw
      SPARK_HOME: /opt/spark
      JAVA_HOME: /usr/lib/jvm/java-8-openjdk-amd64

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Resolve output directory
        id: output-dir
        # Persistent, non-tmp path: survives runner reboots/tmpfiles cleanup, unlike /tmp
        run: echo "dir=$HOME/spark-lab-data/prod" >> "$GITHUB_OUTPUT"

      - name: Run Production Pipeline
        env:
          DAT535_OUTPUT_DIR: ${{ steps.output-dir.outputs.dir }}
        run: |
          source ~/spark-env/bin/activate
          mkdir -p "$DAT535_OUTPUT_DIR"
          
          PIPELINE_TO_RUN="${{ inputs.pipeline || 'project' }}"
          echo "=== Running Bike-Sharing & Weather Pipeline ($PIPELINE_TO_RUN) ==="
          python $GITHUB_WORKSPACE/run_pipeline.py $L<PIPELINE_TO_RUN

      - name: Upload Production artifacts
        uses: actions/upload-artifact@v7
        with:
          name: prod-outputs-${{ github.run_number }}
          path: ${{ steps.output-dir.outputs.dir }}/
          retention-days: 30
          if-no-files-found: ignore

      - name: Write pipeline summary
        run: |
          echo "## Bike-sharing & Weather Production Pipeline" >> $GITHUB_STEP_SUMMARY
          echo "| Key | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Run # | ${{ github.run_number }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Pipeline | ${{ inputs.pipeline || 'project' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered by | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | ${{ github.ref_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ${{ jobs.Status }} |" >> $GITHUB_STEP_SUMMARY 