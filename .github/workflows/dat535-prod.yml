name: DAT535 — Production Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pipeline:
        description: Pipeline to run
        required: true
        default: project
        type: choice
        options: [project, bronze]

jobs:
  deploy-prod:
    name: Run Bike-sharing & Weather Pipeline
    runs-on: self-hosted
    environment: main
    env:
      DAT535_ENV: prod
      SPARK_HOME: /opt/spark
      JAVA_HOME: /usr/lib/jvm/java-8-openjdk-amd64

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Resolve output directory
        id: output-dir
        # Persistent, non-tmp path: survives runner reboots/tmpfiles cleanup, unlike /tmp
        run: echo "dir=$HOME/spark-lab-data/prod" >> "$GITHUB_OUTPUT"

      - name: Run Production Pipeline
        env:
          DAT535_OUTPUT_DIR: ${{ steps.output-dir.outputs.dir }}
          DAT535_RAW_DIR: ${{ steps.output-dir.outputs.dir }}/project/raw
        run: |
          source ~/spark-env/bin/activate
          mkdir -p "$DAT535_OUTPUT_DIR" "$DAT535_RAW_DIR"

          PIPELINE_TO_RUN="${{ inputs.pipeline || 'project' }}"
          echo "=== Running Bike-Sharing & Weather Pipeline ($PIPELINE_TO_RUN) ==="
          python $GITHUB_WORKSPACE/run_pipeline.py "$PIPELINE_TO_RUN"

      - name: Upload Production manifest
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: prod-manifest-${{ github.run_number }}
          path: ${{ steps.output-dir.outputs.dir }}/project/raw/_manifest/
          retention-days: 30
          if-no-files-found: ignore

      - name: Write pipeline summary
        if: always()
        run: |
          echo "## Production Pipeline Run" >> $GITHUB_STEP_SUMMARY
          echo "| Key